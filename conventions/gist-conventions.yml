  - {operations: [POST /v1/summaries], shape: '{error}', note: 403 domain-not-authorized}
  detail: errors/gist-problem-types.yml
rate_limit_signalling:
  response_headers: [X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset]
  exhausted_status: 429
  retry_after: not documented
  detail: rate-limits/gist-rate-limits.yml
caching:
  operations: [GET /v1/publishers, 'GET /v1/publishers/{id}']
  mechanism: server-side Redis cache, TTL 1 hour, with cache headers included in the response
  source: https://platform.gist.ai/reference/get_v1-publishers
request_tracing:
  request_id_header: not documented
metadata:
  supported: false
field_expansion:
  supported: false
content_negotiation:
  request: application/json
  response: application/json, text/event-stream
domain_scoping:
  operation: POST /v1/summaries
  rule: >-
    The submitted URL's domain must EXACTLY match one of the publisher domains attached to the
    caller's publisher group. Subdomains are not implicitly allowed. Violations return 403.
