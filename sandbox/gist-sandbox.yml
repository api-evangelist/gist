note: >-
  Gist separates test from live by HOST, not by key prefix. The docs never publish a test API key,
  a test publisher id, or any magic value, and none is invented here — a sandbox integration still
  requires credentials issued by ProRata during onboarding.
separation:
  mechanism: host-swap
  key_prefixes: none published
  test_credentials_published: false
