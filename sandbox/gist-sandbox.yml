api_sandbox:
  gist_answers_api: >-
    No sandbox host is published for api.gist.ai. The only unauthenticated operation on the API is
    GET /v1/health, which is genuinely public — probed 2026-08-12 and returned a JSON body with a
    per-dependency status map. Every other /v1/* path returns
    {"error":"Unauthorized","message":"Missing or invalid Authorization header","statusCode":401},
    including paths that do not exist, so a 401 there is not evidence an endpoint is present.
  gist_content_api: >-
    No sandbox host is published; the ingest docs give relative paths only.
