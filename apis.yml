aid: gist
name: Gist
description: >-
  Gist is an AI brand-visibility, answer-engine and content-monetization platform built by ProRata
  (founded 2024) that helps publishers and advertisers stay visible, measurable and monetizable
  inside generative AI experiences. It ships three products: Gist GEO (generative engine
  optimization for consistent organic visibility in AI answers), Gist Ads (paid brand amplification
  placed directly in AI search surfaces, with native iOS and Android ad SDKs and a publisher ad
  tag), and Gist Answers (an embeddable, publisher-backed AI answer engine for on-site engagement
  and monetization). Behind those products sits a real developer surface documented at the Gist
  Developer Hub: the Prorata API Service (chat, streaming completions, citations, per-source
  attribution, threads, recommended and related questions, publisher management and document
  summarization) at api.gist.ai, the Gist Content API for publisher article ingestion, the Gist
  Content Network crawler and CMS/RSS ingestion paths, and the gist-chat-widget web component
  distributed from cdn.gist.ai. Gist positions itself as turning AI from a black box into a
  measurable, actionable channel for brands and content owners, with fair attribution and a 50/50
  publisher revenue share as the stated basis of the model.
