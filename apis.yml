apis:
- name: Gist Content API
  description: >-
    Publisher ingest API for the Gist Content Network. Lets publisher partners push articles to ProRata
    in real time (`POST /ingest/article`) or in bulk for archival backfill (`POST /ingest/multiple_articles`),
    as an alternative to the ProRataInc crawler, CMS integrations (WordPress, ArcXP, Strapi, Substack)
    or RSS feeds. Authenticated with a Publisher Group API key sent as `Authorization: Bearer <key>`;
    default limit 10 requests per minute. The documentation publishes the endpoint paths and payloads
    but does not publish the host, so no baseURL is recorded here rather than guessed.
  humanURL: https://platform.gist.ai/docs/gist-content-api
  tags:
  - content-ingestion
  - Publishers
  - Content Licensing
  - Syndication
  tags_raw:
  - content-ingestion
