  The spec declares an EMPTY components.schemas — every request and response body is inlined at
  the operation. The entity graph below was therefore reconstructed from the inline property names
  and the path parameters, not from $ref links, and relationship cardinalities are read from the
  shape of the payloads. Where the spec gives no id format, none is invented.
schema_reuse:
  components_schemas: 0
  note: >-
    Zero reusable schemas across 16 operations is the single largest contract-quality defect in
    this API. Thread, turn, citation, attribution and publisher shapes are each re-declared inline
    wherever they appear, so a generated client gets no shared types and a consumer cannot tell
    that the `threads[]` element in GET /v1/threads is the same entity as GET /v1/threads/{threadId}.
