health_endpoints:
- url: https://api.gist.ai/v1/health
  auth: none (public)
  status: 200
  probed: '2026-08-12'
  shape: {status: string, timestamp: iso8601, uptime: seconds, services: map of dependency to status}
  observation: >-
    Probed live on 2026-08-12 and returned status "unhealthy": database, redis, inference,
    publishers, questions and document reported "operational", while spotlight, fasttapir and
    c2gen reported "failed" with the error "Organization ID is required for requests". That reads
    as an unauthenticated-probe artefact of the health check itself rather than an outage, but it
    is recorded as observed. A public health endpoint that self-reports "unhealthy" to every
    anonymous caller is a real operational-transparency defect worth reporting to the provider.
- url: https://disp-api.prorata.ai/health
  auth: none (public)
  status: 200
  probed: '2026-08-12'
  observation: >-
    Reported "healthy" with per-dependency detail (eas_token_manager, classifier, bloom_filter,
    rabbitmq) for the Gist Ads display service.
