note: >-
  The lifecycle posture is thin and that is the finding. Gist ships a versioned API and a live
  health endpoint, but publishes no changelog, no deprecation policy, no SLA and no status page.
  No StatusPage or Deprecation pointer is emitted in apis.yml, because neither exists.
versioning:
