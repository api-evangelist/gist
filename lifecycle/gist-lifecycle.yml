  current: v1
  docs: https://platform.gist.ai/reference/get_v1-health
  policy_url: null
  note: >-
    The OpenAPI's own servers block is the relative string "/v1" and every path repeats the "/v1"
    prefix, so the published document names no host. The callable form verified on 2026-08-12 is
    https://api.gist.ai + the path as written.
deprecation:
